<!DOCTYPE html>
<html lang="he">
<head>
    <meta charset="UTF-8">
    <title>ממשק קבלת שעה והודעה</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        body {
            background-color: #f0f8ff;
            text-align: right;
        }
        #messageForm {
            max-width: 500px;
            background-color: #ffffff;
            text-align: right;
        }
        button {
            background-color: #007bff;
            border-color: #007bff;
        }
        button:hover {
            background-color: #0056b3;
            border-color: #004085;
        }
    </style>
</head>
<body class="container mt-5">
    <form id="messageForm" class="border p-4 rounded shadow-sm mx-auto">
        <div class="mb-3">
            <label for="time" class="form-label">שעה:</label>
            <input type="time" id="time" class="form-control text-end" required>
        </div>

        <div class="mb-3">
            <label for="message" class="form-label">תוכן הודעה:</label>
            <input type="text" id="message" class="form-control text-end" required>
        </div>

        <button type="submit" class="btn btn-primary">שלח</button>
    </form>

    <div id="responseMessage" class="mt-3 text-center"></div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script>
        document.getElementById("messageForm").addEventListener("submit", function(event) {
            event.preventDefault();

            const time = document.getElementById("time").value;
            const message = document.getElementById("message").value;

            const url = new URL('https://hook.eu2.make.com/y0ymjp0l2rj4vd5t8ytygow1ugtekgdy');
            url.searchParams.append('scheduledTime', time);
            url.searchParams.append('messageContent', message);

            fetch(url, {
                method: 'GET'
            })
            .then(response => response.text())
            .then(data => {
                document.getElementById("responseMessage").innerText = 'ההודעה נשלחה בהצלחה: ' + data;
                document.getElementById("responseMessage").classList.add('text-success');
            })
            .catch((error) => {
                document.getElementById("responseMessage").innerText = 'שגיאה בשליחת ההודעה: ' + error;
                document.getElementById("responseMessage").classList.add('text-danger');
            });
        });
    </script>
</body>
</html>
